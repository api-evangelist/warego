apis:
  - name: WareGo
    description: >-
      WareGo agent-native content surface. A live, well-formed llms.txt provides a curated sitemap of
      product, feature, industry and guide pages for LLM discovery, and is currently the only
      machine-readable artifact WareGo serves. No public API contract, MCP server, agent card or agent
      skill exists. WareGo's own integration guide states it "provides Open APIs" and instructs
      integrators to access API documentation and set up API keys, but links to no reference and routes
      the reader to the WareGo product team instead, so the API is real to customers and invisible to
      the public web.
